name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  TERRAFORM_VERSION: '1.9.8'
  TERRAGRUNT_VERSION: '0.68.4'
  TFLINT_VERSION: 'v0.53.0'

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set up Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: terraform fmt (modules)
        run: terraform fmt -check -recursive terraform/

      - name: terragrunt hclfmt (live)
        run: terragrunt hclfmt --terragrunt-check --terragrunt-working-dir terragrunt/

      - name: TFLint init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TFLint (modules)
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/; do
            echo "::group::tflint $dir"
            tflint --chdir "$dir"
            echo "::endgroup::"
          done

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform validate (modules)
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: tfsec (security scan)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/modules

  Build:
    runs-on: ubuntu-latest
    needs: [Lint, Test]
    # Skipped until AWS OIDC is configured (repo variable AWS_ROLE_ARN) — a skipped required
    # check still counts as passing, so this doesn't block merges in the meantime. See
    # README.md#cicd for how to wire it up.
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set up Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: terragrunt run-all plan
        run: terragrunt run-all plan --terragrunt-non-interactive --terragrunt-working-dir terragrunt/live/shared

  mirror-gitlab:
    name: Mirror to GitLab
    runs-on: ubuntu-latest
    needs: [Lint, Test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to GitLab mirror
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          git push "https://oauth2:${GITLAB_MIRROR_TOKEN}@tools.ages.pucrs.br/2026-2/3jk-5jk/silpo/silpo-iac.git" HEAD:main

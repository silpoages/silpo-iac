name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  TOFU_VERSION: '1.12.6'
  TERRAGRUNT_VERSION: '1.1.5'
  TFLINT_VERSION: 'v0.64.0'

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Set up Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tofu fmt (modules)
        run: tofu fmt -check -recursive terraform/

      - name: terragrunt hcl fmt (live)
        run: terragrunt hcl fmt --check --working-dir terragrunt/

      - name: TFLint init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TFLint (modules)
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/; do
            echo "::group::tflint $dir"
            tflint --chdir "$dir"
            echo "::endgroup::"
          done

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu validate (modules)
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/; do
            echo "::group::validate $dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: tfsec (security scan)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/modules

  Diagram:
    name: Architecture Diagram
    runs-on: ubuntu-latest
    needs: [Lint, Test]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Install diagrams
        run: pip install -r docs/architecture/requirements.txt

      - name: Generate diagram
        working-directory: docs/architecture
        run: python diagram.py

      - name: Upload diagram artifact
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagram
          path: docs/architecture/architecture.png

      - name: Embed in job summary
        run: |
          {
            echo "### Architecture diagram"
            echo "![architecture diagram](data:image/png;base64,$(base64 -w0 docs/architecture/architecture.png))"
          } >> "$GITHUB_STEP_SUMMARY"

      # develop requires a PR (see branch protection), so this can't push there directly — it
      # opens a PR instead, same as any other change. Only runs on push to develop specifically
      # (never main — main only changes via a manually-reviewed develop -> main PR, and letting
      # this bot commit to main independently is exactly how main and develop end up with
      # diverging history, since a bot-fix landing only on main never makes it back to develop).
      # A no-op if the rendered image already matches what's committed.
      #
      # Uses DIAGRAM_BOT_TOKEN (a fine-grained PAT scoped to just this repo, belonging to a user
      # in main/develop's bypass_pull_request_allowances) instead of the default GITHUB_TOKEN:
      # GitHub doesn't run pull_request workflows for PRs opened by GITHUB_TOKEN (loop
      # prevention), so Lint/Test would never run on this PR otherwise.
      - name: Open PR if the diagram changed
        if: github.event_name == 'push' && github.ref_name == 'develop'
        id: diagram-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.DIAGRAM_BOT_TOKEN }}
          add-paths: docs/architecture/architecture.png
          commit-message: 'chore: update architecture diagram'
          title: 'chore: update architecture diagram'
          body: |
            The rendered `docs/architecture/architecture.png` no longer matched the committed
            one, opened automatically by the `Diagram` CI job after `Lint` and `Test` passed on
            this commit — this PR merges itself right after opening, with an admin override, no
            action needed.
          branch: bot/update-architecture-diagram
          base: develop
          delete-branch: true

      # Merges immediately with admin override, gated on this job's own `needs: [Lint, Test]` —
      # i.e. only reached once those two have already passed for this exact commit. --admin is
      # required here: bypass_pull_request_allowances only exempts a direct push or an explicit
      # admin-override merge from the required-review count, NOT GitHub's passive "auto-merge
      # when checks pass" queue (verified empirically — the review requirement still blocked
      # that queue even for a bypass-listed user).
      - name: Merge the diagram PR
        if: steps.diagram-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.DIAGRAM_BOT_TOKEN }}
        run: |
          gh pr merge ${{ steps.diagram-pr.outputs.pull-request-number }} \
            --repo ${{ github.repository }} --admin --squash --delete-branch

  Cost:
    name: AWS Cost Estimate
    runs-on: ubuntu-latest
    needs: [Lint, Test]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate cost estimate
        run: infracost breakdown --config-file infracost.yml --format json --out-file /tmp/infracost.json

      - name: Update README cost section
        run: |
          infracost output --path /tmp/infracost.json --format table > /tmp/cost-table.txt
          python3 - <<'PYEOF'
          import re

          with open("/tmp/cost-table.txt") as f:
              table = f.read()
          with open("README.md") as f:
              readme = f.read()

          block = "<!-- infracost-start -->\n```text\n" + table + "```\n<!-- infracost-end -->"
          readme = re.sub(
              r"<!-- infracost-start -->.*?<!-- infracost-end -->",
              lambda _: block,
              readme,
              flags=re.DOTALL,
          )

          with open("README.md", "w") as f:
              f.write(readme)
          PYEOF

      - name: Upload cost report artifact
        uses: actions/upload-artifact@v4
        with:
          name: cost-estimate
          path: /tmp/infracost.json

      - name: Embed in job summary
        run: |
          {
            echo "### AWS cost estimate"
            echo '```text'
            cat /tmp/cost-table.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Same pattern as the Diagram job above (see its comments for the full rationale): only
      # self-commits on push to develop, never main; uses DIAGRAM_BOT_TOKEN so Lint/Test actually
      # run on the opened PR (the default GITHUB_TOKEN can't trigger pull_request workflows on a
      # PR it opens itself), then merges immediately with an admin override once this job's own
      # `needs: [Lint, Test]` already confirmed they passed on this commit.
      - name: Open PR if the cost estimate changed
        if: github.event_name == 'push' && github.ref_name == 'develop'
        id: cost-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.DIAGRAM_BOT_TOKEN }}
          add-paths: README.md
          commit-message: 'chore: update AWS cost estimate'
          title: 'chore: update AWS cost estimate'
          body: |
            The Infracost breakdown no longer matched the committed README section, opened
            automatically by the `Cost` CI job after `Lint` and `Test` passed on this commit —
            this PR merges itself right after opening, with an admin override, no action needed.
          branch: bot/update-cost-estimate
          base: develop
          delete-branch: true

      - name: Merge the cost estimate PR
        if: steps.cost-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.DIAGRAM_BOT_TOKEN }}
        run: |
          gh pr merge ${{ steps.cost-pr.outputs.pull-request-number }} \
            --repo ${{ github.repository }} --admin --squash --delete-branch

  mirror-gitlab:
    name: Mirror to GitLab
    runs-on: ubuntu-latest
    needs: [Lint, Test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to GitLab mirror
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          git push "https://oauth2:${GITLAB_MIRROR_TOKEN}@tools.ages.pucrs.br/2026-2/3jk-5jk/silpo/silpo-iac.git" HEAD:main

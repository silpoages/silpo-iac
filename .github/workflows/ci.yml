name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  TOFU_VERSION: '1.12.6'
  TERRAGRUNT_VERSION: '1.1.5'
  TFLINT_VERSION: 'v0.64.0'

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Set up Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tofu fmt (modules)
        run: tofu fmt -check -recursive terraform/

      - name: terragrunt hcl fmt (live)
        run: terragrunt hcl fmt --check --working-dir terragrunt/

      - name: TFLint init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TFLint (modules)
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/; do
            echo "::group::tflint $dir"
            tflint --chdir "$dir"
            echo "::endgroup::"
          done

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu validate (modules)
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/; do
            echo "::group::validate $dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: tfsec (security scan)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/modules

  Build:
    runs-on: ubuntu-latest
    needs: [Lint, Test]
    # Skipped until AWS OIDC is configured (repo variable AWS_ROLE_ARN) — a skipped required
    # check still counts as passing, so this doesn't block merges in the meantime. See
    # README.md#cicd for how to wire it up.
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Set up Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: terragrunt plan --all
        working-directory: terragrunt/live/shared
        run: terragrunt plan --all --non-interactive --backend-bootstrap

  Diagram:
    name: Architecture Diagram
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Install diagrams
        run: pip install -r docs/architecture/requirements.txt

      - name: Generate diagram
        working-directory: docs/architecture
        run: python diagram.py

      - name: Upload diagram artifact
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagram
          path: docs/architecture/architecture.png

      - name: Embed in job summary
        run: |
          {
            echo "### Architecture diagram"
            echo "![architecture diagram](data:image/png;base64,$(base64 -w0 docs/architecture/architecture.png))"
          } >> "$GITHUB_STEP_SUMMARY"

      # main/develop require a PR (see branch protection), so this can't push there directly —
      # it opens a PR instead, same as any other change. Only runs on push; a no-op if the
      # rendered image already matches what's committed (nothing to open a PR for).
      - name: Open PR if the diagram changed
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: docs/architecture/architecture.png
          commit-message: 'chore: update architecture diagram'
          title: 'chore: update architecture diagram'
          body: |
            The rendered `docs/architecture/architecture.png` no longer matched the committed
            one, opened automatically by the `Diagram` CI job on `${{ github.ref_name }}`.

            Note: GitHub doesn't run `pull_request` workflows for PRs opened by the default
            `GITHUB_TOKEN`, so `Lint`/`Test`/`Build` won't show up here on their own — push an
            empty commit (or use the "re-run" button once any check appears) to get them to run
            before merging.
          branch: bot/update-architecture-diagram-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true

  mirror-gitlab:
    name: Mirror to GitLab
    runs-on: ubuntu-latest
    needs: [Lint, Test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to GitLab mirror
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          git push "https://oauth2:${GITLAB_MIRROR_TOKEN}@tools.ages.pucrs.br/2026-2/3jk-5jk/silpo/silpo-iac.git" HEAD:main

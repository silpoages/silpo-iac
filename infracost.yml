# Infracost multi-project config. Each module is analyzed standalone (no Terragrunt, no AWS
# credentials) with the same representative values used in terragrunt/live/shared/*/terragrunt.hcl
# (including the same mock dependency outputs used there for validate/plan) — keep these two in
# sync by hand if either changes. See README.md#cost-estimate.
#
# The one value that ISN'T hand-typed here is the AWS region used for pricing: none of these
# modules declare their own provider block (Terragrunt generates it per-environment, from
# env.hcl's aws_region), so without one Infracost would silently price everything as us-east-1
# regardless of where it's actually deployed. Each project's `env.AWS_REGION` below resolves that
# the same way the real aws provider does — from the AWS_REGION environment variable — and the
# Cost CI job sets that env var by reading env.hcl directly (see .github/workflows/ci.yml), so the
# region itself still only lives in one place.
version: 0.1

projects:
  - path: terraform/modules/networking
    name: networking
    env:
      AWS_REGION: ${AWS_REGION}
    terraform_vars:
      name: silpo-shared
      azs: ["sa-east-1a", "sa-east-1b"]
      vpc_cidr: "10.0.0.0/16"
      public_subnet_cidrs: ["10.0.0.0/24", "10.0.1.0/24"]
      private_subnet_cidrs: ["10.0.10.0/24", "10.0.11.0/24"]
      enable_nat_gateway: false

  - path: terraform/modules/ecr
    name: ecr
    env:
      AWS_REGION: ${AWS_REGION}
    terraform_vars:
      name: silpo-backend
      image_tag_mutability: "IMMUTABLE"
      scan_on_push: true
      untagged_expire_days: 14

  - path: terraform/modules/rds-postgres
    name: rds-postgres
    env:
      AWS_REGION: ${AWS_REGION}
    terraform_vars:
      name: silpo-shared
      vpc_id: vpc-00000000000000000
      subnet_ids: ["subnet-00000000000000001", "subnet-00000000000000002"]
      allowed_cidr_blocks: ["10.0.0.0/16"]
      instance_class: "db.t4g.micro"
      allocated_storage: 20
      max_allocated_storage: 20
      multi_az: false
      backup_retention_period: 3
      deletion_protection: true
      skip_final_snapshot: false

  - path: terraform/modules/ecs-service
    name: ecs-service
    env:
      AWS_REGION: ${AWS_REGION}
    terraform_vars:
      name: silpo-shared
      vpc_id: vpc-00000000000000000
      public_subnet_ids: ["subnet-00000000000000001", "subnet-00000000000000002"]
      task_subnet_ids: ["subnet-00000000000000001", "subnet-00000000000000002"]
      assign_public_ip: true
      image: "000000000000.dkr.ecr.sa-east-1.amazonaws.com/silpo-backend:latest"
      container_port: 8000
      cpu: 256
      memory: 512
      desired_count: 1

  - path: terraform/modules/static-site
    name: static-site
    env:
      AWS_REGION: ${AWS_REGION}
    terraform_vars:
      name: silpo-web-000000000000
      spa_fallback: true

  # dns is intentionally left out: it looks up its hosted zone with a `data` source that needs
  # real AWS credentials to resolve, so static analysis can't plan it. The *resources this module
  # creates* (ACM certs, Route53 alias records) are free, but that's not the full domain cost —
  # registering silpoages.com is a real annual registrar fee (~US$13+/year for .com via Route53),
  # and the hosted zone itself is ~US$0.50/month. Neither is created by this module (the zone is
  # created automatically by domain registration, which happens outside Terraform), so neither
  # shows up here, but budget for both.
